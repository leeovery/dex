diff_exclude = ["design/"]

[release]
version_file = "pyproject.toml"
version_pattern = 'version = "{version}"'

[release.hooks]
# Instances pin tags, so a broken tag reaches every instance at its next sync
# and the only rollback is hand-editing pins. The gate runs in `preflight`,
# which mint executes before anything else — before the AI release notes and
# before the human reviews them — so a red suite costs seconds, not a wasted
# notes pass. A failing entry aborts the run: no bookkeeping commit, no tag.
#
# `--locked` fails on a pyproject/uv.lock drift. The live suite is deliberately
# absent: it is deselected by the default addopts anyway, and a third party
# having a bad afternoon must never be able to block a release.
preflight = [
    "uv sync --locked",
    "uv run --no-sync ruff check",
    "uv run --no-sync ty check",
    "uv run --no-sync ruff format --check .",
    "uv run --no-sync pytest -m 'not live'",
]
# pre_tag runs on the PRE-BUMP tree (device-verified: a hook during the
# v0.0.3 probe read the version file and saw 0.0.2), and no hook runs
# between mint's own bump and the tag. Left to mint, the bump commits a
# pyproject that disagrees with uv.lock — the v0.1.1 tag shipped exactly
# that, and every `uv sync --locked` on it fails — and `uv build` bakes
# the OLD version into the wheel. So the hook does the bump itself:
# `uv version` moves pyproject and uv.lock together to $MINT_NEW_VERSION
# (exported to hooks), mint sweeps both into its pre-tag artifacts
# commit, and its own bump then finds the file already current — the
# bookkeeping commit carries just the changelog.
pre_tag = ["sh -c 'uv version \"$MINT_NEW_VERSION\"'", "uv build"]
