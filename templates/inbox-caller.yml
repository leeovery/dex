name: inbox
# Thin caller — the logic lives in the dex engine's reusable workflow. It runs
# entirely in YOUR repo with YOUR token; no data leaves your volume. If you are
# not leeovery, you're trusting the engine repo's code: pin a commit SHA instead
# of @main, or fork the engine and point 'uses:' at your fork.

on:
  repository_dispatch:
    types: [inbox]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: inbox-append
  cancel-in-progress: false

jobs:
  inbox:
    uses: leeovery/dex/.github/workflows/inbox-reusable.yml@main
