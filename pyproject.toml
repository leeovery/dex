[project]
name = "dex-engine"
# 0.0.1 is the pre-rewrite engine — its tag exists on the remote, and migration 1
# stamps un-versioned old ledger lines with it (the retry-on-new-engine baseline).
# The rewrite must therefore identify as newer than 0.0.1 even before its first
# release, or bootstrap would pin v0.0.1 and hand instances back to the old
# engine. Mint bumps this at release time as usual.
version = "0.1.2"
description = "Shared pipeline engine for dex knowledge-base instances"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=1.12",
    # Direct: the article seam prepares a page's HTML before extraction
    # (drivers/article.py). trafilatura pulls lxml in anyway, but an
    # import we make ourselves is a dependency we declare ourselves.
    "lxml>=5.0",
    "yt-dlp>=2025.1.1",
    "firecrawl-anydoc>=0.2.0",
    "faster-whisper>=1.2.1",
]

[project.scripts]
dex-normalize = "dex_engine.normalize:main"
dex-enrich = "dex_engine.enrich:main"
dex-lint = "dex_engine.lint:main"
dex-exclude = "dex_engine.exclude:main"
dex-sync = "dex_engine.sync:main"
dex-new = "dex_engine.new:main"
dex-inbox = "dex_engine.inbox:main"
dex-render = "dex_engine.render.cli:main"
dex-issue = "dex_engine.issue:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dex_engine"]

[tool.hatch.build.targets.wheel.force-include]
"instance" = "dex_engine/instance"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
    "ruff>=0.16.3",
    "ty>=0.0.73",
    # lxml ships no inline types; without the stubs ty cannot resolve the
    # article seam's imports at all, and the choice is stubs or a blanket
    # ignore over the one place we touch a DOM.
    "lxml-stubs>=0.5.1",
]
mutation = [
    "mutmut>=3.7.0",
]
test = [
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown holds prose, not shipped code. The design doc's protocol sketches
# align their trailing comments into columns to be read as a table, and
# `.agents/skills/**` is vendored. Formatting the fenced Python inside either
# rewrites documents nothing imports.
extend-exclude = ["*.md", ".agents"]
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # formatter conflict
    "ISC001",  # formatter conflict
    "CPY001",  # no copyright headers in this repo
    "D105",    # docstrings on magic methods (__post_init__) add nothing
    "EM101",   # string literals in raises — messages inline is house style here
    "EM102",   # f-strings in raises — same
    "TRY003",  # long exception messages — loud, specific errors are the design
    "TRY004",  # schema/payload errors are typed ValueErrors by design, not TypeErrors
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "D",       # docstrings not required on tests
    "ANN",     # type annotations not required on tests
    "PLR2004", # magic values are expected in assertions
    "INP001",  # pytest test dirs are not packages
    "RUF001",  # non-Latin test data — what the prompt budget is about — is not a typo
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: hits real network APIs — opt-in via `-m live` (CI runs hermetic only)",
    "ci_hostile: a live check whose endpoint treats a datacenter IP differently from a laptop, or whose cost is a cold multi-megabyte download — the scheduled live workflow runs these best-effort so a blocked runner never mails a false alarm",
]

[tool.mutmut]
# Targeted use only: `uv run --group mutation mutmut run "<module path>.*"`.
# A whole-repo run mutates thousands of lines against 1800 tests and buries the
# signal in equivalent mutants — the tool is for auditing ONE module you suspect.
source_paths = ["src/dex_engine"]
pytest_add_cli_args_test_selection = ["tests"]
# mutmut instruments by renaming every function to `x_<name>__mutmut_orig`,
# generating mutant copies beside it and dispatching, so a test asserting on a
# traceback frame's function name or on the module's source text cannot pass
# under it. Three do; deselecting them costs nothing (two pin the issue filer's
# frame formatting, one counts `datetime.now(` occurrences in ledger.py's
# source — meta-properties, not mutable branches).
pytest_add_cli_args = [
    "--deselect",
    "tests/pipeline/test_issues.py::TestErrorEvent::test_engine_frames_are_package_relative",
    "--deselect",
    "tests/pipeline/test_issues.py::TestSanitization::test_engine_frames_survive_sanitization",
    "--deselect",
    "tests/pipeline/test_ledger.py::TestStamp::test_stamping_never_calls_the_ambient_clock",
]
# mutmut runs the suite from a copied `mutants/` tree; tests/ and pyproject.toml
# come for free, but tests/test_shim.py reaches out to instance/dex.
also_copy = ["instance"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

