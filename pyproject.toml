[project]
name = "dex-engine"
version = "0.1.0"
description = "Shared pipeline engine for dex knowledge-base instances (normalize, enrich, lint, exclude)"
requires-python = ">=3.11"
dependencies = ["trafilatura>=1.12", "yt-dlp>=2025.1.1", "pypdf>=5"]

[project.scripts]
kb-normalize = "dex_engine.normalize:main"
kb-enrich = "dex_engine.enrich:main"
kb-lint = "dex_engine.lint:main"
kb-exclude = "dex_engine.exclude:main"
kb-sync = "dex_engine.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dex_engine"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "dex_engine/templates"
